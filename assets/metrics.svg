<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="176" viewBox="0 0 1120 176" role="img" aria-labelledby="title desc">
  <title id="title">Headline results</title>
  <desc id="desc">1.65 million parameters, 0.50 giga MACs, PESQ 3.32 and STOI 0.956.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".18"/></filter>
  </defs>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="10" y="12" width="260" height="148" rx="22" fill="url(#g1)"/>
    <rect x="290" y="12" width="260" height="148" rx="22" fill="url(#g2)"/>
    <rect x="570" y="12" width="260" height="148" rx="22" fill="url(#g3)"/>
    <rect x="850" y="12" width="260" height="148" rx="22" fill="url(#g4)"/>
    <g fill="#fff" text-anchor="middle">
      <text x="140" y="81" font-size="40" font-weight="800">1.65M</text><text x="140" y="115" font-size="15" font-weight="700" opacity=".86" letter-spacing="2">PARAMETERS</text>
      <text x="420" y="81" font-size="40" font-weight="800">0.50G</text><text x="420" y="115" font-size="15" font-weight="700" opacity=".86" letter-spacing="2">MACS</text>
      <text x="700" y="81" font-size="40" font-weight="800">3.32</text><text x="700" y="115" font-size="15" font-weight="700" opacity=".86" letter-spacing="2">PESQ</text>
      <text x="980" y="81" font-size="40" font-weight="800">0.956</text><text x="980" y="115" font-size="15" font-weight="700" opacity=".86" letter-spacing="2">STOI</text>
    </g>
  </g>
</svg>

